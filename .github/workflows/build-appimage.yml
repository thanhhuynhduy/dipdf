name: Build AppImage (Fedora)

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # ✅ chạy toàn bộ job trong container Fedora 44
    container:
      image: fedora:44

    steps:
      - name: Install dependencies (Fedora)
        run: |
          dnf -y update
          dnf -y install \
            git cmake gcc-c++ \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtdeclarative \
            qt6-qtbase \
            qt6-qttools \
            qt6-qttools-devel \
            poppler-qt6-devel \
            pkgconf-pkg-config \
            wget file

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build project
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor

          cp build/DiPDF AppDir/usr/bin/
          cp -r icons/hicolor/* AppDir/usr/share/icons/hicolor/

      - name: Create desktop entry
        run: |
          cat > AppDir/DiPDF.desktop <<EOF
          [Desktop Entry]
          Name=DiPDF
          Exec=DiPDF
          Icon=dipdf
          Type=Application
          Categories=Office;Viewer;
          EOF

      - name: Download linuxdeployqt
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage

      # ✅ FIX: extract AppImage thay vì chạy trực tiếp
      - name: Extract linuxdeployqt
        run: |
          ./linuxdeployqt-continuous-x86_64.AppImage --appimage-extract

      - name: Build AppImage
        run: |
          export QML_SOURCES_PATHS=.
          export QT_PLUGIN_PATH=/usr/lib64/qt6/plugins
          export QML2_IMPORT_PATH=/usr/lib64/qt6/qml

          ./squashfs-root/AppRun AppDir/DiPDF.desktop \
            -appimage \
            -unsupported-allow-new-glibc \
            -qmldir=. \
            -bundle-non-qt-libs \
            -verbose=2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPDF-AppImage
          path: "*.AppImage"