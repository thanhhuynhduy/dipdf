name: Build AppImage

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build DiPDF AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            wget \
            file \
            patchelf \
            desktop-file-utils \
            ca-certificates \
            pkg-config \
            libfuse2t64 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-svg-dev \
            qt6-wayland \
            fcitx5-frontend-qt6 \
            libpoppler-qt6-dev \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxkbcommon-x11-dev

      - name: Prepare version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ARCH=x86_64" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "NO_STRIP=1" >> "$GITHUB_ENV"

      - name: Build AppImage
        shell: bash
        run: |
          chmod +x ./build-appimage-docker.sh
          VERSION="${VERSION}" ARCH="${ARCH}" ./build-appimage-docker.sh

      - name: Show output
        shell: bash
        run: |
          ls -lh *.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPDF-AppImage-${{ env.VERSION }}-${{ env.ARCH }}
          path: '*.AppImage'
          if-no-files-found: error

      - name: Upload AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.AppImage'
